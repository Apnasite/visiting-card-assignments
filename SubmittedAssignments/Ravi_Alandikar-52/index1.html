<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visiting Card</title>
  <link rel="stylesheet" href="./css/index1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
  <div class="outercontainer">
    <div class="card1">
      <div class="inverted-triangle"></div>
      <div class="diagonal-triangle"></div>
      <div class="diagonal-square1">
        <div class="img">
          <img src="./IMG/org-logo.png" alt="Organization Logo" />
        </div>
      </div>
      <div class="diagonal-triangle1"></div>
      <div class="triangle2"></div>

      <div class="card1-content">
        <div class="Name">
          <h3>Mali <span style="color: rgb(255, 217, 0);">Ketan</span></h3>
        </div>
        <div class="Job-title">
          <h5 style="color: purple;">-Web Developer</h5>
        </div>
        <hr />

        <div class="description">
          <!-- Phone -->
          <div class="party-phone">
            <span class="phone">
              <img id="phone1" src="./IMG/phone.png" alt="Phone Icon" />
            </span>
            <span class="party-phone-label">+917038249592</span>
            <span class="party-phone-number">+917038249592</span>
          </div>
          <hr />

          <!-- Email -->
          <div class="party-email">
            <i class="bi bi-envelope"></i>
            <span class="party-email-lable"></span>
            <span class="email"><img id="email" src="./IMG/mail.png" alt="Email Icon" /></span>
            <span class="party-email-address">ketuvmali311</span>
            <span class="party-email-address">@gmail.com</span>
          </div>
          <hr />

          <!-- Address -->
          <div class="party-email">
            <i class="bi bi-envelope"></i>
            <span class="party-email-lable"></span>
            <span class="location">
              <img id="location" src="./IMG/location.png" alt="Location Icon" />
            </span>
            <!-- <span class="party-email-address">Office No.404,</span> -->
            <span class="party-email-address">Wakad,Pimpri-Chinchwad,Pune 411057</span>
            <hr />
          </div>
        </div>
      </div>
    </div>
  </div>

  <br /><br /><br /><br />

  <div class="card2">
    <div class="rectangle"></div>
    <div class="rectangle1">
      <div>
        <img id="logo" src="./IMG/org-logo.png" alt="Organization Logo" />
      </div>
    </div>
    <div class="triangle"></div>
  </div>
</body>

</html>
