<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Card</title>
  <link rel="stylesheet" href="./css/index1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="outercontainer">
    <div class="card1">

        <div class="inverted-triangle"></div>
        <div class="diagonal-triangle"></div>
        <div class="diagonal-square1">
            <div class="img">
                <img src="./IMG/org-logo.png" alt="">
             </div>
        </div>
        <div class="diagonal-triangle1"></div>
        <div class="triangle2"></div>

        <div class="card1-content">
            <div class="Name"><h3>Jhon <span style="color: rgb(255, 217, 0);">Doe</span> </h3></div>
            <div class="Job-title"><h5 style="color: purple;">-Web Developer</h5></div><hr>
            <!-- <div class="company">MMEAC</div> -->
          
          <!-- Additional Contact Information -->
            <!-- <div class="qr-code">x
                <img src="./IMG/qr.png" class="qr-img">
            </div> -->
            <div class="description"> 
              <div class="party-phone">
                <span class="phone" >
                    <img id="phone1" src="./IMG/phone.png" alt="Phone Icon">
                </span>
                <span class="party-phone-label">+917038249592</span>
                <span class="party-phone-number">+917038249592</span>
            </div>
          <hr>
            <div class="party-email">
                <i class="bi bi-envelope"></i>
                
                <span class="party-email-lable"></span>
                <span class="email"><img id="email" src="./IMG/mail.png" alt=""></span>
                <span class="party-email-address">jason@gmail.com</span>
                <span class="party-email-address">jason@gmail.com</span>
            </div>
            <hr>
            <div class="party-email">
                <i class="bi bi-envelope"></i>
                <span class="party-email-lable"></span>
                <span class="location"><img id="location" src="./IMG/location.png" alt=""></span>
                <span class="party-email-address">Your street </span>
                <span class="party-email-address">newyork City-000</span><hr>
            </div>
          </div>
        </div>


    </div>

  </div>
    <br>
    <br>
    <br>
    <br>

    <div class="card2">
      <div class="rectangle"></div>
      <div class="rectangle1">
        <div>
          <img id="logo" src="./IMG/org-logo.png" alt="">
        </div>
      </div>
      <div class="triangle"></div>
    </div>

  </div>
  
</body>
</html>
